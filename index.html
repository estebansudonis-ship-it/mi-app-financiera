<script>
        // CONFIGURACIONES Y CREDENCIALES DE INFRAESTRUCTURA CLOUD
        const SUPABASE_URL = "https://ltmvcqkpgrwqsinfqqkt.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_TP5UKKudDEefb5KogaRcsw_Ezn1OxbA"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let activeSessionUser = null;
        let db_ingresos = []; let db_ahorros = []; let db_tarjetas = []; let db_gastos = []; let db_compras = [];
        const nombresMesesCompleto = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        // 1. CONTROL DE VISTAS INDEPENDIENTES
        function cambiarSeccionVista(targetViewId, elementBtn) {
            // Ocultar todas las vistas
            document.querySelectorAll('.view-section').forEach(view => view.style.display = 'none');
            
            // Mostrar la seleccionada
            document.getElementById(targetViewId).style.display = 'flex';
            
            // Administrar estado activo del menú lateral
            if(elementBtn) {
                document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
                elementBtn.classList.add('active');
            }
            
            // Renderizaciones específicas si regresa a inicio
            if(targetViewId === 'vista_inicio') {
                actualizarCoreCalculos();
            }
        }

        function navegarASeccionDirecto(viewId) {
            let itemMenu = Array.from(document.querySelectorAll('.nav-button')).find(btn => btn.innerText.includes(viewId.replace('vista_','').toUpperCase()));
            cambiarSeccionVista(viewId, itemMenu);
        }

        // CONTROL DE SESIÓN Y AUTENTICACIÓN (CORREGIDO)
        async function verificarCredencialesSesion() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                activeSessionUser = session.user;
                document.getElementById('auth_gate_wrapper').style.display = 'none';
                document.getElementById('app_core_shell').style.display = 'flex';
                document.getElementById('user_display_mail').innerText = activeSessionUser.email;
                document.getElementById('avatar_letra').innerText = activeSessionUser.email.charAt(0).toUpperCase();
                
                await descargarEstructurasCloud();
            }
        }

        async function loginMecanismo() {
            let email = document.getElementById('auth_user_email').value;
            let pass = document.getElementById('auth_user_password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password: pass });
            if(error) {
                document.getElementById('auth_gate_error').innerText = "Credenciales incorrectas. Si no recuerdas tu contraseña, restablécela en Supabase.";
            } else { 
                activeSessionUser = data.user; 
                location.reload(); 
            }
        }

        async function logoutMecanismo() {
            await _supabase.auth.signOut();
            location.reload();
        }

        async function descargarEstructurasCloud() {
            if(!activeSessionUser) return;
            let rIng = await _supabase.from('ingresos').select('*'); db_ingresos = rIng.data || [];
            let rTar = await _supabase.from('tarjetas').select('*'); db_tarjetas = rTar.data || [];
            let rGas = await _supabase.from('gastos').select('*'); db_gastos = rGas.data || [];
            let rAho = await _supabase.from('ahorros').select('*'); db_ahorros = rAho.data || [];
            let rCom = await _supabase.from('compras').select('*'); db_compras = rCom.data || [];

            actualizarCoreCalculos();
        }

        function getTasaCambioEstatica() { return parseFloat(document.getElementById('tasaCambio')?.value) || 7.8; }
        function normalizarAQuetzales(monto, moneda) { return moneda === 'USD' ? monto * getTasaCambioEstatica() : monto; }

        // CÁLCULOS Y RENDERIZACIÓN DE LA NUEVA INTERFAZ INICIO
        function actualizarCoreCalculos() {
            let filtroMes = document.getElementById('filtro_mes_maestro').value;
            if(!filtroMes) return;
            let piezas = filtroMes.split('-');
            let anioAct = parseInt(piezas[0]); let mesAct = parseInt(piezas[1]);

            // Cálculos Financieros Base
            let totalIngresos = db_ingresos.filter(i => (i.tipo==='fijo' && (anioAct>i.anio || (anioAct===i.anio && mesAct>=i.mes))) || (i.tipo==='variable' && i.anio===anioAct && i.mes===mesAct)).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
            let totalGastosEfec = db_gastos.filter(g => g.medio_pago === 'efectivo' && ((g.tipo==='fijo' && (anioAct>g.anio || (anioAct===g.anio && mesAct>=g.mes))) || (g.tipo==='variable' && g.anio===anioAct && g.mes===mesAct))).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
            
            let gastosTarjetasDirectos = db_gastos.filter(g => g.medio_pago !== 'efectivo' && ((g.tipo==='fijo' && (anioAct>g.anio || (anioAct===g.anio && mesAct>=g.mes))) || (g.tipo==='variable' && g.anio===anioAct && g.mes===mesAct))).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
            let cuotasTarjetasAmortizadas = db_compras.filter(c => {
                let pIni = c.fecha_inicio.split('-'); let pFin = c.fecha_fin.split('-');
                let act = anioAct * 12 + mesAct;
                return act >= (parseInt(pIni[0])*12 + parseInt(pIni[1])) && act <= (parseInt(pFin[0])*12 + parseInt(pFin[1]));
            }).reduce((a, b) => a + b.pago_mensual, 0);
            let totalTarjetasCarga = gastosTarjetasDirectos + cuotasTarjetasAmortizadas;

            let disponibleMes = totalIngresos - (totalGastosEfec + totalTarjetasCarga);
            if(disponibleMes < 0) disponibleMes = 0;

            // Inyectar KPIs Principales
            document.getElementById('kpi_disponible').innerText = "Q " + disponibleMes.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('kpi_ingresos').innerText = "Q " + totalIngresos.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('kpi_gastos').innerText = "Q " + totalGastosEfec.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('kpi_tarjetas').innerText = "Q " + totalTarjetasCarga.toLocaleString('en-US', {minimumFractionDigits:2});

            // Renderizar Componentes
            renderHistogramaCombinado(mesAct, anioAct);
            renderDonutGastos(totalGastosEfec);
            renderTarjetasSaaS();
            renderModuloAhorros(mesAct, anioAct);
            renderCapacidadMish(mesAct, anioAct);
            renderCompromisosTabla(mesAct, anioAct);
        }

        // HISTOGRAMA COMBINADO DE FLUJO DE CAJA (ÚLTIMOS 6 MESES ANTERIORES / REALES)
        function renderHistogramaCombinado(mesB, anioB) {
            let cont = document.getElementById('contenedor_histograma'); if(!cont) return;
            cont.innerHTML = "";
            let maxMonto = 1; let mesesData = [];

            // Retroceder 5 meses para completar un bloque analítico real de 6 meses
            let mInicio = mesB - 5; let aInicio = anioB;
            while(mInicio <= 0) { mInicio += 12; aInicio--; }

            for(let i=0; i<6; i++) {
                let currM = mInicio + i; let currA = aInicio;
                while(currM > 12) { currM -= 12; currA++; }
                
                let ing = db_ingresos.filter(inv => (inv.tipo==='fijo' && (currA>inv.anio || (currA===inv.anio && currM>=inv.mes))) || (inv.tipo==='variable' && inv.anio===currA && inv.mes===currM)).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
                let gas = db_gastos.filter(g => g.medio_pago === 'efectivo' && ((g.tipo==='fijo' && (currA>g.anio || (currA===g.anio && currM>=g.mes))) || (g.tipo==='variable' && g.anio===currA && g.mes===currM))).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
                
                if(ing > maxMonto) maxMonto = ing;
                if(gas > maxMonto) maxMonto = gas;
                mesesData.push({ label: nombresMesesCompleto[currM-1], ing, gas });
            }

            mesesData.forEach(d => {
                let hIng = (d.ing / maxMonto) * 140;
                let hGas = (d.gas / maxMonto) * 140;
                cont.innerHTML += `
                    <div class="chart-column">
                        <div class="bar-top-val" style="font-size:9px;">Q${Math.round(d.ing/1000)}k</div>
                        <div class="bars-container">
                            <div class="v-bar income" style="height:${hIng}px;"></div>
                            <div class="v-bar expense" style="height:${hGas}px;"></div>
                        </div>
                        <div class="chart-label">${d.label}</div>
                    </div>`;
            });
        }

        // DISTRIBUCIÓN DE GASTOS (DONUT CHART CONCEPTUAL)
        function renderDonutGastos(gTotal) {
            document.getElementById('donut_total_interior').innerText = "Q " + Math.round(gTotal/1000) + "k";
            let ley = document.getElementById('lista_leyenda_donut'); if(!ley) return;
            ley.innerHTML = `
                <div class="legend-item"><div class="donut-color-dot"><div class="color-dot" style="background-color:var(--red-negative)"></div>Fijos</div><b>65%</b></div>
                <div class="legend-item"><div class="donut-color-dot"><div class="color-dot" style="background-color:var(--orange-warning)"></div>Variables</div><b>25%</b></div>
                <div class="legend-item"><div class="donut-color-dot"><div class="color-dot" style="background-color:var(--blue-info)"></div>Otros</div><b>10%</b></div>`;
        }

        // RESUMEN DE TARJETAS
        function renderTarjetasSaaS() {
            let cont = document.getElementById('bloque_tarjetas_inicio'); if(!cont) return;
            cont.innerHTML = "";
            let auxTarjetas = db_tarjetas.slice(0, 2); // Máximo 2 tarjetas en Inicio
            if(auxTarjetas.length === 0) {
                cont.innerHTML = `<div style="font-size:12px; color:var(--text-secondary); text-align:center; padding:10px;">No hay tarjetas activas registradas.</div>`;
                return;
            }
            auxTarjetas.forEach(t => {
                let colorBarra = "var(--green-positive)";
                cont.innerHTML += `
                    <div class="credit-card-strip">
                        <div class="card-strip-header">
                            <div class="bank-identity"><span class="bank-name">${t.nombre}</span><span class="card-digits">•••• 4321</span></div>
                            <span class="badge purple">Corte: ${t.corte}</span>
                        </div>
                        <div class="card-utilization-bar-frame">
                            <div class="card-utilization-fill" style="width: 45%; background-color:${colorBarra};"></div>
                        </div>
                        <div class="card-strip-metrics">
                            <span>Utilizado: <b>Q ${t.lim_cuotas * 0.45}</b></span>
                            <span>Límite: <b>Q ${t.lim_cuotas}</b></span>
                        </div>
                    </div>`;
            });
        }

        // RESUMEN DE AHORROS
        function renderModuloAhorros(mAct, aAct) {
            let baseAhorro = parseFloat(localStorage.getItem('db_a_base')) || 15000;
            let aportesMes = db_ahorros.filter(a => a.anio === aAct && a.mes === mAct).reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
            let totalAcumulado = baseAhorro + db_ahorros.reduce((a, b) => a + normalizarAQuetzales(b.monto, b.moneda), 0);
            
            document.getElementById('ahorro_total_kpi').innerText = "Q " + totalAcumulado.toLocaleString('en-US', {minimumFractionDigits:2});
            document.getElementById('meta_ahorro_lbl').innerText = "Meta activa de inversión: Q 50,000.00";
            
            let pct = (totalAcumulado / 50000) * 100; if(pct > 100) pct = 100;
            document.getElementById('barra_progreso_ahorro_fill').style.width = pct + "%";

            let lista = document.getElementById('lista_aportes_recientes_inicio'); if(!lista) return;
            lista.innerHTML = "";
            let ultimosAportes = db_ahorros.slice(-2);
            if(ultimosAportes.length === 0) {
                lista.innerHTML = `<li style="border:none; padding:4px 0; font-size:12px; color:var(--text-secondary);">No hay aportes este mes.</li>`;
            }
            ultimosAportes.forEach(ap => {
                lista.innerHTML += `<li style="padding:6px 0; border-bottom:1px solid var(--borders); display:flex; justify-content:space-between; font-size:12px;"><span>✨ ${ap.nombre}</span><b>Q ${ap.monto}</b></li>`;
            });
        }

        // CAPACIDAD CREDITICIA (GRÁFICO DE LÍNEA SIMPLIFICADO)
        function renderCapacidadMish(mesB, anioB) {
            let cont = document.getElementById('mish_chart_inicio'); if(!cont) return;
            let mInicio = mesB - 5; let aInicio = anioB;
            while(mInicio <= 0) { mInicio += 12; aInicio--; }
            
            let coords = [];
            for(let i=0; i<6; i++) {
                let currM = mInicio + i; let currA = aInicio;
                while(currM > 12) { currM -= 12; currA++; }
                let x = 20 + (i * 36);
                let y = 50 - (i * 5); // Simulación de curva ascendente controlada
                coords.push(`${x},${y}`);
            }
            cont.innerHTML = `
                <svg width="100%" height="100%" viewBox="0 0 240 80" preserveAspectRatio="none">
                    <path d="M ${coords.join(' L ')}" fill="none" stroke="#5B45F5" stroke-width="2.5"/>
                    ${coords.map(c => `<circle cx="${c.split(',')[0]}" cy="${c.split(',')[1]}" r="3.5" fill="#5B45F5"/>`).join('')}
                </svg>`;
        }

        // PRÓXIMOS COMPROMISOS (TABLA COMPACTA)
        function renderCompromisosTabla(mAct, aAct) {
            let tbody = document.getElementById('tabla_compromisos_inicio'); if(!tbody) return;
            tbody.innerHTML = "";
            
            // Unificar una muestra ordenada de compromisos vigentes
            let muestra = [];
            db_gastos.filter(g => g.tipo==='fijo').slice(0, 2).forEach(x => muestra.push({ fecha: `10/${mAct}`, concepto: x.nombre, monto: x.monto, tipo: 'Servicio', cls: 'blue' }));
            db_compras.slice(0, 2).forEach(x => muestra.push({ fecha: `Abono`, concepto: x.concepto, monto: x.pago_mensual, tipo: 'Cuota', cls: 'orange' }));
            
            if(muestra.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-secondary);">No hay compromisos estipulados para este periodo.</td></tr>`;
                return;
            }
            muestra.slice(0, 4).forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.fecha}</td>
                        <td><b>${m.concepto}</b></td>
                        <td>Q ${m.monto.toLocaleString('en-US')}</td>
                        <td><span class="badge ${m.cls}">${m.tipo}</span></td>
                    </tr>`;
            });
        }

        // LLAMADO DE ARRANQUE CORREGIDO
        verificarCredencialesSesion();
    </script>
